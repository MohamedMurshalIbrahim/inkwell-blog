name: CD - Deploy to Render

on:
  push:
    branches: [main]        # runs only when a PR is merged into main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [monolith, services/articles, services/web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: cd ${{ matrix.app }} && npm test

  deploy:
    needs: test             # deploy only if every test passed
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hooks
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_HOOK_MONOLITH }}"
          curl -fsS -X POST "${{ secrets.RENDER_HOOK_ARTICLES }}"
          curl -fsS -X POST "${{ secrets.RENDER_HOOK_WEB }}"