name: CD - Deploy to Render

on:
  push:
    branches: [main]        # runs only when a PR is merged into main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [monolith, services/articles, services/web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd ${{ matrix.app }} && npm install

      - name: Install Articles dependencies for Web test
        if: ${{ matrix.app == 'services/web' }}
        working-directory: services/articles
        run: npm install

      - name: Start Articles server
        if: ${{ matrix.app == 'services/web' }}
        working-directory: services/articles
        run: npm start &

      - name: Wait for Articles
        if: ${{ matrix.app == 'services/web' }}
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health; then
              echo "Articles is ready"
              break
            fi
            sleep 1
          done

      - name: Set ARTICLES_URL
        if: ${{ matrix.app == 'services/web' }}
        run: echo "ARTICLES_URL=http://127.0.0.1:4000" >> "$GITHUB_ENV"

      - name: Run tests
        run: cd ${{ matrix.app }} && npm test

  deploy:
    needs: test             # deploy only if every test passed
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hooks
        env:
          HOOK_MONOLITH: ${{ secrets.RENDER_HOOK_MONOLITH }}
          HOOK_ARTICLES: ${{ secrets.RENDER_HOOK_ARTICLES }}
          HOOK_WEB: ${{ secrets.RENDER_HOOK_WEB }}
        run: |
          if [ -n "$HOOK_MONOLITH" ]; then curl -fsS -X POST "$HOOK_MONOLITH"; fi
          if [ -n "$HOOK_ARTICLES" ]; then curl -fsS -X POST "$HOOK_ARTICLES"; fi
          if [ -n "$HOOK_WEB" ]; then curl -fsS -X POST "$HOOK_WEB"; fi